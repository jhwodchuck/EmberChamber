name: CI - Repo Contracts

on:
  push:
    branches: [main, "copilot/**"]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "repo-map.yaml"
      - "docs/*.md"
      - "docs/api/**"
      - "docs/architecture/**"
      - "docs/plansforwork/**"
      - "docs/product/**"
      - "docs/security/**"
      - "docs/wiki/**"
      - "docs/wiki-site/screenshots.md"
      - "docs/wiki-site/.vitepress/**"
      - "docs/wiki-site/package.json"
      - "llm_council/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "apps/web/README.md"
      - "apps/web/src/app/app/**"
      - "apps/relay/src/index.ts"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "repo-map.yaml"
      - "docs/*.md"
      - "docs/api/**"
      - "docs/architecture/**"
      - "docs/plansforwork/**"
      - "docs/product/**"
      - "docs/security/**"
      - "docs/wiki/**"
      - "docs/wiki-site/screenshots.md"
      - "docs/wiki-site/.vitepress/**"
      - "docs/wiki-site/package.json"
      - "llm_council/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "apps/web/README.md"
      - "apps/web/src/app/app/**"
      - "apps/relay/src/index.ts"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"

concurrency:
  group: ci-repo-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repo contracts and doc/runtime alignment
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Check repo contracts
        run: npm run check:repo-contracts

      - name: Check documentation links
        run: npm run check:links

      - name: Check release version alignment
        run: npm run check:release-version
