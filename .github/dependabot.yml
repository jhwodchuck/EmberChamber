version: 2
updates:
  # npm – root workspace (apps/relay, apps/web, packages/*)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Expo packages are versioned as an SDK-aligned set. Individual major
      # bumps install incompatible SDK 57/58 packages into the SDK 55 app and
      # fail the mobile verification lane. Upgrade them together during an
      # explicit Expo SDK migration instead of opening one broken PR per package.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      # react-native-worklets is coupled to the current React Native Reanimated
      # line; take its next major as part of the same deliberate mobile upgrade.
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major"]

  # Cargo – root workspace (crates/*, apps/desktop/src-tauri)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # glib >=0.20.0 requires gtk-rs 0.20.x which tauri has not adopted yet.
      # The root gtk->glib constraint comes from tauri and cannot be overridden.
      # Re-enable once tauri ships a release using gtk-rs 0.20.x.
      # Tracks: https://github.com/tauri-apps/tauri/issues
      - dependency-name: "glib"
        versions: [">=0.20.0"]

  # Cargo – desktop Tauri crate (has its own Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # Same upstream blocker as above – glib 0.20.x is incompatible with
      # the gtk 0.18.x that tauri 2.x currently depends on.
      - dependency-name: "glib"
        versions: [">=0.20.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
